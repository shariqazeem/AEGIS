# AEGIS Web Sentinel - Nginx Configuration
# Reverse proxy with SSL support

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstream for AEGIS backend
    upstream aegis_backend {
        server aegis:8001;
        keepalive 32;
    }

    # HTTP server - redirect to HTTPS (uncomment when SSL is configured)
    server {
        listen 80;
        server_name _;

        # For SSL certificate verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # For now, proxy directly (before SSL is set up)
        location / {
            proxy_pass http://aegis_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Uncomment below to redirect HTTP to HTTPS after SSL setup
        # location / {
        #     return 301 https://$host$request_uri;
        # }
    }

    # HTTPS server (uncomment after SSL certificate is obtained)
    # server {
